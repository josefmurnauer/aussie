# @package _global_
defaults:
  - /cls
  - override /net@model.net: lgatr
  - override /dataset: wwbb
  - _self_

data:
  on_gpu: true

dataset:
  reader:
    path_data: '/ptmp/mpp/mjosef/data_files/WbWb_files/bulk_region/converted_files/df_herwig_ttbar_singletop_DR_train.h5'
    path_mc: '/ptmp/mpp/mjosef/data_files/WbWb_files/bulk_region/converted_files/df_pythia_ttbar_train.h5'
    num: null
    max_particles_gen: null
  process:
    _target_: src.datasets.WWbbProcess

model:
  net:
    backbone:
      in_v_channels: 1
      in_s_channels: 4 # one hot pid
      hidden_v_channels: 8
      hidden_s_channels: 32
      num_blocks: 4
      num_heads: 4
      compile: True

training:
  batch_size: 512
  test_batch_size: 4096
  optimizer:
    warmup_steps: 5000
    weight_decay: 0.0    
