# @package _global_
defaults:
  - /unf
  - override /net@model.net: lgatr
  - override /dataset: wwbb
  - _self_

data:
  on_gpu: true

model:
  _target_: src.models.AutoDiffUnfolder
  net:
    backbone:
      in_v_channels: 1
      in_s_channels: 3    # is_mu, is_met, is_jet, obj_pt -- no tagging info at truth level
      hidden_v_channels: 16
      hidden_s_channels: 32
      out_s_channels: 32   # explicit -- avoids broken ${net.backbone.hidden_s_channels}
      num_blocks: 4
      num_heads: 4
    head:
      dim_in: 32            # explicit -- avoids broken ${net.backbone.out_s_channels}
      hidden_channels: 32    # explicit -- avoids broken ${net.backbone.out_s_channels}

training:
  lr: 0.001
  batch_size: 1024
  optimizer:
    warmup_steps: 5000
    weight_decay: 0.0